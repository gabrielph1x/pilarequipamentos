name: Mirror repository

on:
  push:
    branches:
      - "**"

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Mirror repository
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          git clone --mirror https://github.com/gabrielph1x/pilarequipamentos.git repo.git
          cd repo.git
          git push --mirror https://x-access-token:${MIRROR_TOKEN}@github.com/samuelyanss/pilarequipamentos.git